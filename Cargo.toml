[package]
name = "d3d9-to-11"
version = "0.1.0"
authors = ["Gabriel Majeri <gabriel.majeri6@gmail.com>"]
license = "LGPL3+"
edition = "2018"

[lib]
name = "d3d9"
crate-type = ["cdylib"]

[dependencies]
log = "=0.4.8"
env_logger = "0.5"
comptr = { git = "https://github.com/GabrielMajeri/comptr-rs" }
com-impl = { git = "https://github.com/GabrielMajeri/com-impl-rs" }
bitflags = "1"
nalgebra = "0.16"

# ХАК ДЛЯ СТАРОГО СБОРЩИКА: Явно фиксируем транзитивные зависимости, 
# чтобы Cargo не скачивал их современные версии из 2024-2026 годов.
num-traits = "=0.2.11"
num-complex = "=0.2.4"
regex = "=1.4.2"
regex-syntax = "=0.6.25"
memchr = "=2.3.3"
winapi-util = "=0.1.5"
thread_local = "=1.0.1"

[dependencies.winapi]
version = "=0.3.8"
features = [
    "winerror",
    "d3d9",
    "dxgi",
    "d3d11",
    "winuser",
]
